<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trackline Sim</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#0b1220;
color:white;
overflow:hidden;
}

#topbar{
height:60px;
background:#121c31;
display:flex;
align-items:center;
padding:0 20px;
gap:20px;
border-bottom:1px solid #24344f;
}

.stat{
background:#1b2b45;
padding:8px 14px;
border-radius:8px;
}

#layout{
display:flex;
height:calc(100vh - 60px);
}

#sidebar{
width:320px;
background:#121c31;
overflow:auto;
padding:15px;
border-right:1px solid #24344f;
}

#map{
flex:1;
}

button{
padding:10px;
width:100%;
margin-top:8px;
cursor:pointer;
background:#2d6cdf;
border:none;
border-radius:8px;
color:white;
}

.train{
background:#19263f;
padding:10px;
margin-top:8px;
border-radius:8px;
}

.route{
background:#1b2440;
padding:10px;
margin-top:8px;
border-radius:8px;
}

h3{
margin-bottom:10px;
}

input{
width:100%;
padding:8px;
margin-top:5px;
margin-bottom:5px;
background:#202d46;
border:none;
color:white;
}
</style>
</head>
<body>

<div id="topbar">
<div class="stat">💰 Cash: <span id="cash">100000000</span></div>
<div class="stat">📈 Revenue: <span id="revenue">0</span></div>
<div class="stat">👥 Passengers: <span id="passengers">0</span></div>
<div class="stat">🚆 Trains: <span id="trains">0</span></div>
</div>

<div id="layout">

<div id="sidebar">

<h3>Trackline Sim</h3>

<button onclick="buyTrain('Siemens ICE 3',320,460,32000000)">
Buy Siemens ICE 3
</button>

<button onclick="buyTrain('CR400AF',350,576,40000000)">
Buy CR400AF
</button>

<button onclick="buyTrain('E5 Shinkansen',320,731,45000000)">
Buy E5 Shinkansen
</button>

<hr style="margin:15px 0">

<h3>Create Route</h3>

<input id="origin" placeholder="Origin City">
<input id="destination" placeholder="Destination City">

<button onclick="createRoute()">
Create Route
</button>

<hr style="margin:15px 0">

<h3>Fleet</h3>
<div id="fleet"></div>

<hr style="margin:15px 0">

<h3>Routes</h3>
<div id="routes"></div>

</div>

<div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const company={
cash:100000000,
revenue:0,
passengers:0,
trains:[]
};

const routes=[];

const cities={
Tokyo:[35.6812,139.7671],
Osaka:[34.7025,135.4959],
Seoul:[37.5563,126.9723],
Beijing:[39.9042,116.4074],
Shanghai:[31.2304,121.4737],
Bangkok:[13.7563,100.5018],
Delhi:[28.6139,77.2090],
Mumbai:[19.0760,72.8777],
Dhaka:[23.8103,90.4125],
Jakarta:[-6.2088,106.8456],
Singapore:[1.3521,103.8198]
};

const map=L.map('map').setView([28,95],4);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{maxZoom:18}
).addTo(map);

Object.entries(cities).forEach(([name,coord])=>{
L.marker(coord)
.addTo(map)
.bindPopup(name);
});

function updateUI(){

document.getElementById("cash").innerText=
Math.round(company.cash);

document.getElementById("revenue").innerText=
Math.round(company.revenue);

document.getElementById("passengers").innerText=
Math.round(company.passengers);

document.getElementById("trains").innerText=
company.trains.length;
}

function buyTrain(name,speed,cap,price){

if(company.cash<price){
alert("Not enough cash");
return;
}

company.cash-=price;

company.trains.push({
name,
speed,
cap,
price
});

renderFleet();
updateUI();
}

function renderFleet(){

fleet.innerHTML="";

company.trains.forEach(train=>{

fleet.innerHTML+=`
<div class="train">
<b>${train.name}</b><br>
${train.speed} km/h<br>
${train.cap} seats
</div>
`;

});
}

function createRoute(){

const o=document.getElementById("origin").value;
const d=document.getElementById("destination").value;

if(!cities[o]||!cities[d]){
alert("City not found");
return;
}

const line=L.polyline(
[
cities[o],
cities[d]
],
{
color:'#2d6cdf',
weight:4
}
).addTo(map);

routes.push({
origin:o,
destination:d,
line
});

renderRoutes();
}

function renderRoutes(){

routesDiv=document.getElementById("routes");

routesDiv.innerHTML="";

routes.forEach(r=>{

routesDiv.innerHTML+=`
<div class="route">
${r.origin} → ${r.destination}
</div>
`;

});
}

setInterval(()=>{

let dailyPassengers=0;

routes.forEach(()=>{

dailyPassengers+=
Math.floor(Math.random()*2000)+500;

});

let revenue=dailyPassengers*30;

company.passengers+=dailyPassengers;

company.revenue+=revenue;

company.cash+=revenue;

updateUI();

},3000);

updateUI();

</script>

</body>
</html>
